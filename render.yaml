services:
  - type: web
    name: adybajaj-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn core.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: adybajaj-api.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: adybajaj-db
          property: connectionString

databases:
  - name: adybajaj-db
    plan: free
